name = "z3-wallet-web"
main = "./worker/index.ts"
compatibility_date = "2026-03-20"

[build]
command = "bun run build"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Ensure API paths always hit the user worker before SPA asset fallback.
run_worker_first = ["/api", "/api/*"]

# Set `VITE_API_URL=/api` at build time and configure `API_BASE_URL`
# in your Cloudflare Worker environment to proxy API requests.
# `API_BASE_URL` may be host-only (e.g. `https://api.example.com`) or include
# the version path (e.g. `https://api.example.com/v1`).
